# Claude reviews every pull request, and reviews again after every new push.
# Together with claude.yml this is the review loop:
#   push -> Claude reviews -> "@claude fix these" (or fix by hand) -> push -> Claude reviews again
# Needs the Claude GitHub App and one secret (see README). Without the secret it skips itself.
name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    env:
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - name: Skip when no Claude secret is set
        if: env.HAS_CLAUDE != 'true'
        run: echo "::notice::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret, so no Claude review."
      - uses: actions/checkout@v6
        if: env.HAS_CLAUDE == 'true'
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        if: env.HAS_CLAUDE == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing a pull request in a student project. Read AGENTS.md and docs/PLAN.md first.
            Review only what this pull request changes. Look for, in this order:
            1. Bugs: wrong results, crashes, time-zone mistakes (all timestamps must be UTC), wrong units.
            2. Secrets, .env files or real business data committed to this public repo.
            3. Missing or weak tests for new logic, and tests changed just to make them pass.
            4. Rule breaks from AGENTS.md, such as logic inside app/ pages instead of offpeak/.
            5. Code much more complicated than it needs to be.
            Skip style nits; ruff handles those.

            Put each concrete problem as an inline comment on the line, with a suggested fix.
            Then post one summary with gh pr comment, in plain language for a beginner. Start it with
            exactly one of these lines:
            "✅ Claude review: no blocking problems." or "🔁 Claude review: changes needed."
            If changes are needed, end with: "Reply @claude fix the review comments to let Claude fix them."
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
