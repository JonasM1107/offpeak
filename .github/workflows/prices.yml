name: Prices

# Tomorrow's DE-LU prices appear around 13:00 CET. Poll every 15 minutes from 11:45 to
# 14:00 UTC (12:45-15:00 CET in winter, 13:45-16:00 CEST in summer); the job skips as soon
# as tomorrow is stored. GitHub may start scheduled runs late, so the window is generous.
on:
  schedule:
    - cron: "45 11 * * *"
    - cron: "*/15 12-13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run python -m offpeak.jobs.ingest_prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
