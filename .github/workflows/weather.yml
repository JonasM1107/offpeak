name: Weather

# Every 3 hours, at quarter past, so it does not compete with the full-hour rush.
on:
  schedule:
    - cron: "15 */3 * * *"
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run python -m offpeak.jobs.ingest_weather
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
