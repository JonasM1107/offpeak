name: Offpeak Intelligence outlook

# After the morning weather update and after tomorrow's prices are usually published
# (around 13:00 German time). Runs that find nothing new skip after one database query.
# GitHub often runs scheduled workflows late or skips them, so the outlook also starts
# right after every Prices or weather run; a run with nothing new skips after one query.
on:
  schedule:
    - cron: "10 8,12,13,15 * * *"
  workflow_run:
    workflows: ["Prices", "Weather for the price model"]
    types: [completed]
  workflow_dispatch:

# never two outlook runs at once; a new trigger waits for the running one
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --no-dev
      - run: uv run python -m offpeak.jobs.forecast_prices
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
