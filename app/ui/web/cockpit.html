<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--KIT-->
<style>
  .cockpit { display: grid; grid-template-columns: minmax(260px, 340px) minmax(0, 1fr); gap: 14px; align-items: start; }
  .step-no { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: #fff;
    font-size: 13px; font-weight: 700; margin-right: 8px; vertical-align: 1px; }
  /* 1 · machines */
  .list { display: flex; flex-direction: column; gap: 8px; }
  .mach { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 13px 15px; cursor: pointer; font: inherit; color: var(--ink);
    display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; align-items: start; transition: border-color .15s, box-shadow .15s; }
  .mach:hover { border-color: var(--accent-mid); }
  .mach.on { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .mach .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; }
  .mach b { display: block; font-size: 15px; font-weight: 650; }
  .mach small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 3px; line-height: 1.45; }
  .mach .best { color: var(--accent-ink); font-weight: 600; }
  .add { display: flex; gap: 8px; margin-top: 12px; }
  .add select { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font: inherit; font-size: 13.5px; background: var(--card); color: var(--ink); }
  .add button { border: 0; background: var(--accent); color: #fff; border-radius: 12px; padding: 0 16px; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
  /* 2 · the job */
  .job { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 22px; }
  .field label { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .field label output { color: var(--ink); font-weight: 650; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); margin: 0; }
  .name { width: 100%; border: 0; border-bottom: 1px dashed var(--line); background: transparent; font: inherit; font-size: 20px; font-weight: 650; color: var(--ink); padding: 2px 0 6px; margin-bottom: 14px; }
  .name:focus { outline: none; border-bottom-color: var(--accent); }
  .jobhead { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .del { border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; cursor: pointer; padding: 4px 0; }
  .del:hover { color: var(--accent-ink); }
  .usual { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; grid-template-columns: 180px minmax(0, 1fr) 64px; gap: 12px; align-items: center; font-size: 13px; color: var(--muted); }
  .usual output { text-align: right; color: var(--ink); font-weight: 650; }
  /* 3 · the answer */
  .answer h2 { font-size: 28px; letter-spacing: -.02em; margin: 2px 0 12px; font-weight: 700; }
  .answer h2 span { color: var(--accent); }
  .stats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
  .stat { background: var(--card2); border-radius: 12px; padding: 9px 13px; font-size: 13.5px; color: var(--muted); }
  .stat b { color: var(--ink); font-size: 16px; margin-right: 4px; }
  .stat.good { background: var(--accent-soft); } .stat.good b { color: var(--accent-ink); }
  #chart { height: 300px; margin-top: 6px; }
  .alts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .alt { border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; }
  .alt b { font-weight: 650; }
  .empty { color: var(--muted); font-size: 14px; padding: 18px 0; }
  @media (max-width: 900px) { .cockpit { grid-template-columns: 1fr; } .job { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="cockpit reveal">
    <div class="card">
      <div class="head"><div><h3><span class="step-no">1</span>Pick a machine</h3><div class="sub">Your flexible machines, each with its best time this week</div></div></div>
      <div class="list" id="list"></div>
      <div class="add"><select id="preset" aria-label="Machine type"></select><button id="add">+ Add</button></div>
      <p class="insight" style="margin:10px 0 0;font-size:12.5px" id="kept"></p>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="card" id="jobcard">
        <div class="head"><div><h3><span class="step-no">2</span>Describe the job</h3><div class="sub">How much power, how long, and when it may run</div></div></div>
        <div id="job"></div>
      </div>
      <div class="card answer">
        <div class="head"><div><h3><span class="step-no">3</span>Best time to run it</h3><div class="sub" id="answer-sub">Cheapest start in the next 7 days, using your own solar and wind power first</div></div></div>
        <div id="answer"></div>
        <div id="chart" class="chart"></div>
        <div class="sub" style="margin-top:10px">Other good times</div>
        <div class="alts" id="alts"></div>
      </div>
    </div>
  </div>
  <p class="insight" style="margin:0;font-size:11.5px" id="foot"></p>
</div>

<script>window.OFFPEAK = __DATA__;</script>
<script>
// The hours ahead (all-in prices, likely range, own surplus) come from Python
// (offpeak/cockpit.py: horizon). The search mirrors offpeak/cockpit.py week_plan, which
// tests/test_cockpit.py pins down, so the cockpit, the dashboard and Ollie agree.
const D = window.OFFPEAK, H = D.horizon, N = H.t.length, DAYS = H.days, NOW = D.now_index;
const { nf, pad } = OP;
const COLORS = ['#FF5F00', '#3A3733', '#F2A33A', '#8C6A5A', '#C24700', '#77726A', '#E8A87C', '#4A4640'];
const eur = (v, d = 2) => `€${nf(v, d)}`;

// ── Machines: saved by Python; every change is sent back (app/ui/web/bridge) ──
let machines = D.machines.map(m => ({ ...m }));
const save = () => { try { window.parent.offpeakSend({ machines }); } catch (e) { /* outside Streamlit */ } };
let sel = 0;

// ── The search (same rules as offpeak/cockpit.py) ──────────────────────────
function jobCost(start, m, buy, surplus) {
  let c = 0;
  for (let h = start; h < start + m.hours; h++) { const own = Math.min(m.kw, surplus[h]); c += (own * H.sell[h] + (m.kw - own) * buy[h]) / 100; }
  return c;
}
function startsOn(day, m) {
  const ds = DAYS[day].start, first = Math.max(ds + m.earliest, NOW), last = Math.min(ds + m.latest_end - m.hours, N - m.hours);
  const out = []; for (let s = first; s <= last; s++) out.push(s); return out;
}
function bestOn(day, m, surplus) {
  let best = null;
  for (const s of startsOn(day, m)) { const c = jobCost(s, m, H.buy, surplus); if (!best || c < best.cost) best = { start: s, cost: c, day }; }
  return best;
}
function usualStart(m) {  // the next day whose usual start has not passed yet
  for (let d = 0; d < DAYS.length; d++) { const s = DAYS[d].start + m.usual_start; if (s >= NOW && s + m.hours <= N) return s; }
  return null;
}
// every machine at its cheapest start this week, largest first, sharing the own surplus
function planAll() {
  const left = H.surplus.slice(), res = [];
  machines.map((m, i) => i).sort((a, b) => machines[b].kw - machines[a].kw).forEach(i => {
    const m = machines[i], mine = left.slice();
    const perDay = DAYS.map((_, d) => bestOn(d, m, mine)).filter(Boolean).sort((a, b) => a.cost - b.cost);
    const best = perDay[0] || null, u = usualStart(m);
    const r = { best, alts: perDay.slice(1, 4), usual: null, saving: null, lo: null, hi: null, own: 0 };
    if (best) {
      if (u !== null) {
        r.usual = { start: u, cost: jobCost(u, m, H.buy, mine) };
        r.saving = r.usual.cost - best.cost;
        const a = jobCost(u, m, H.buy_lo, mine) - jobCost(best.start, m, H.buy_lo, mine);
        const b = jobCost(u, m, H.buy_hi, mine) - jobCost(best.start, m, H.buy_hi, mine);
        r.lo = Math.min(a, b, r.saving); r.hi = Math.max(a, b, r.saving);
      }
      let own = 0;
      for (let h = best.start; h < best.start + m.hours; h++) { own += Math.min(m.kw, left[h]); left[h] = Math.max(0, left[h] - m.kw); }
      r.own = own / (m.kw * m.hours);
    }
    res[i] = r;
  });
  return res;
}

// ── Words ──────────────────────────────────────────────────────────────────
const dayName = s => { let d = 0; DAYS.forEach((x, k) => { if (s >= x.start) d = k; }); return d === 0 ? 'today' : d === 1 ? 'tomorrow' : DAYS[d].name; };
const endHour = (s, h) => pad((H.hour[s] + h) % 24 || (H.hour[s] + h === 24 ? 24 : 0));
const when = (s, h) => `${dayName(s)} ${pad(H.hour[s])}:00–${endHour(s, h)}:00`;
const estimate = (s, h) => { for (let k = s; k < s + h; k++) if (H.kind[k] === 'forecast') return true; return false; };

// ── 1 · Pick a machine ─────────────────────────────────────────────────────
function renderList(res) {
  document.getElementById('list').innerHTML = machines.length ? machines.map((m, i) => {
    const r = res[i];
    return `<button class="mach ${i === sel ? 'on' : ''}" data-i="${i}"><span class="dot" style="background:${COLORS[i % COLORS.length]}"></span>
      <span><b>${m.name}</b><small>${nf(m.kw, 0)} kW · ${m.hours} h</small>
      <small class="best">${r.best ? `${when(r.best.start, m.hours)}${r.saving > 0.005 ? ` · saves ${eur(r.saving)}` : ''}` : 'does not fit this week'}</small></span></button>`;
  }).join('') : '<p class="empty">No machines yet. Add one below.</p>';
  document.querySelectorAll('.mach').forEach(b => b.addEventListener('click', () => { sel = +b.dataset.i; renderJob(); update(); }));
}

// ── 2 · Describe the job ───────────────────────────────────────────────────
const slider = (k, label, min, max, unit) => {
  const m = machines[sel];
  return `<div class="field"><label>${label}<output id="o-${k}">${m[k]}${unit}</output></label><input type="range" min="${min}" max="${max}" step="1" value="${m[k]}" data-k="${k}" data-u="${unit}"></div>`;
};
function renderJob() {
  const box = document.getElementById('job');
  document.getElementById('jobcard').style.display = machines.length ? '' : 'none';
  if (!machines.length) return;
  const m = machines[sel];
  box.innerHTML = `<div class="jobhead"><input class="name" id="name" value="${m.name.replace(/"/g, '&quot;')}" aria-label="Machine name"><button class="del" id="del">Remove</button></div>
    <div class="job">
      ${slider('kw', 'Power', 1, 100, ' kW')}
      ${slider('hours', 'Job length', 1, 12, ' h')}
      <div class="field"><label>Allowed between<output id="o-window">${pad(m.earliest)}:00–${pad(m.latest_end)}:00</output></label>
        <input type="range" min="0" max="23" step="1" value="${m.earliest}" data-k="earliest" aria-label="Earliest start">
        <input type="range" min="1" max="24" step="1" value="${m.latest_end}" data-k="latest_end" aria-label="Done by" style="margin-top:10px"></div>
    </div>
    <label class="usual"><span>Usually starts at (to compare)</span><input type="range" min="0" max="23" step="1" value="${m.usual_start}" data-k="usual_start"><output id="o-usual_start">${pad(m.usual_start)}:00</output></label>`;
  box.querySelectorAll('input[type=range]').forEach(el => el.addEventListener('input', () => {
    const k = el.dataset.k; m[k] = +el.value;
    if (m.earliest + m.hours > m.latest_end) { if (k === 'latest_end') m.earliest = Math.max(0, m.latest_end - m.hours); else m.latest_end = Math.min(24, m.earliest + m.hours); }
    box.querySelectorAll('input[type=range]').forEach(x => { if (+x.value !== m[x.dataset.k]) x.value = m[x.dataset.k]; });
    ['kw', 'hours'].forEach(f => { document.getElementById('o-' + f).textContent = m[f] + (f === 'kw' ? ' kW' : ' h'); });
    document.getElementById('o-window').textContent = `${pad(m.earliest)}:00–${pad(m.latest_end)}:00`;
    document.getElementById('o-usual_start').textContent = `${pad(m.usual_start)}:00`;
    save(); update();
  }));
  document.getElementById('name').addEventListener('change', e => { m.name = e.target.value.trim() || 'Machine'; save(); update(); });
  document.getElementById('del').addEventListener('click', () => { machines.splice(sel, 1); sel = 0; save(); renderJob(); update(); });
}

// ── 3 · Best time to run it ────────────────────────────────────────────────
let current = null;
function renderAnswer(res) {
  const box = document.getElementById('answer'), alts = document.getElementById('alts');
  if (!machines.length) { box.innerHTML = '<p class="empty">Add a machine to see its best time.</p>'; alts.innerHTML = ''; current = null; return; }
  const m = machines[sel], r = res[sel]; current = { m, r };
  if (!r.best) { box.innerHTML = '<p class="empty">This job does not fit its allowed hours in the coming days. Widen the window or shorten the job.</p>'; alts.innerHTML = ''; return; }
  const b = r.best, est = estimate(b.start, m.hours);
  box.innerHTML = `<h2>Start <span>${dayName(b.start)} at ${pad(H.hour[b.start])}:00</span>, done by ${endHour(b.start, m.hours)}:00</h2>
    <div class="stats">
      <span class="stat"><b>${eur(b.cost)}</b>per run</span>
      ${r.saving != null ? `<span class="stat ${r.saving > 0.005 ? 'good' : ''}"><b>${r.saving > 0.005 ? eur(r.saving) : '±€0'}</b>${r.saving > 0.005 ? `saved against ${pad(m.usual_start)}:00${est && r.hi - r.lo > 0.05 ? ` (likely ${eur(Math.max(0, r.lo))}–${eur(r.hi)})` : ''}` : 'your usual time is already best'}</span>` : ''}
      <span class="stat"><b>${nf(r.own * 100, 0)} %</b>own solar and wind</span>
    </div>
    <div class="sub">${est ? 'Prices for this day are an estimate by Offpeak Intelligence.' : 'Prices for this day are published.'}</div>`;
  alts.innerHTML = r.alts.length ? r.alts.map(a => `<span class="alt">${when(a.start, m.hours)} · <b>${eur(a.cost)}</b></span>`).join('') : '<span class="sub">No other day fits the window.</span>';
}

const ms = H.t.map(t => t * 1000);
const chart = OP.chart(document.getElementById('chart'), c => {
  const B = OP.base(c);
  const pub = H.buy.map((v, i) => [ms[i], H.kind[i] === 'published' ? v : null]);
  const lastPub = H.kind.lastIndexOf('published');
  const fc = H.buy.map((v, i) => [ms[i], H.kind[i] === 'forecast' || i === lastPub ? v : null]);
  const areas = [];
  if (current && current.r.best) {
    const { m, r } = current;
    areas.push([{ name: 'best', xAxis: ms[r.best.start], itemStyle: { color: c.accent, opacity: .28 } }, { xAxis: ms[r.best.start] + m.hours * 3600e3 }]);
    // "best" is labelled at the top, "usual" at the bottom: when the two times are next to
    // each other or overlap, the labels would otherwise be drawn on top of each other
    if (r.usual) areas.push([{ name: 'usual', xAxis: ms[r.usual.start], itemStyle: { color: c.grey, opacity: .45 }, label: { position: 'insideBottom' } }, { xAxis: ms[r.usual.start] + m.hours * 3600e3 }]);
  }
  return { ...B, grid: { left: 46, right: 14, top: 22, bottom: 28 },
    tooltip: { ...B.tooltip, trigger: 'axis', formatter: ps => { const i = ps[0].dataIndex; return `<b>${DAYS[0] && dayName(i)} ${pad(H.hour[i])}:00</b><br>${nf(H.buy[i])} ct/kWh${H.kind[i] === 'forecast' ? ' (estimate)' : ''}${H.surplus[i] > 0 ? `<br>own surplus ${nf(H.surplus[i], 0)} kW` : ''}`; } },
    xAxis: { type: 'time', ...B.axis, splitLine: { show: false }, axisLabel: { ...B.axis.axisLabel, hideOverlap: true, formatter: { day: '{ee} {d}', hour: '{HH}:{mm}' } } },
    yAxis: { type: 'value', scale: true, ...B.axis, axisLabel: { ...B.axis.axisLabel, formatter: '{value} ct' } },
    series: [
      { type: 'line', step: 'start', symbol: 'none', data: pub, lineStyle: { color: c.ink, width: 1.6 },
        markArea: { silent: true, label: { show: true, position: 'insideTop', color: c.muted, fontSize: 11, formatter: p => p.name === 'best' ? 'best' : 'usual' }, data: areas },
        markLine: { silent: true, symbol: 'none', lineStyle: { color: c.accent, type: [4, 3] }, label: { formatter: 'now', color: c.accent, fontSize: 11 }, data: [{ xAxis: ms[NOW] }] } },
      { type: 'line', step: 'start', symbol: 'none', data: fc, lineStyle: { color: c.accent, width: 1.6, type: [5, 4] } },
    ] };
});

// ── Add a machine ──────────────────────────────────────────────────────────
const PRESETS = [
  ['EV charging (fleet)', 22, 4, 7, 24, 17], ['Compressed air', 15, 3, 6, 20, 8], ['Industrial dishwasher', 9, 2, 6, 22, 13],
  ['Laundry (washers + dryers)', 18, 3, 6, 22, 9], ['Water heater', 6, 3, 0, 24, 6], ['Irrigation pump', 7, 2, 0, 24, 18],
  ['Cold store pre-cooling', 12, 2, 0, 24, 14], ['Kiln / oven batch', 30, 5, 5, 22, 7], ['Forklift charging', 8, 6, 0, 24, 18],
];
document.getElementById('preset').innerHTML = PRESETS.map((p, i) => `<option value="${i}">${p[0]} · ${p[1]} kW, ${p[2]} h</option>`).join('');
document.getElementById('add').addEventListener('click', () => {
  const [name, kw, hours, earliest, latest_end, usual_start] = PRESETS[+document.getElementById('preset').value];
  machines.push({ name, kw, hours, earliest, latest_end, usual_start }); sel = machines.length - 1; save(); renderJob(); update();
});

function update() {
  const res = planAll();
  renderList(res); renderAnswer(res); chart.update();
}
document.getElementById('kept').textContent = {
  database: 'Changes are saved automatically for everyone on this site.',
  local: 'Not signed in: changes stay in this browser tab.',
  session: 'No database connected: changes stay until you close this tab.',
}[D.storage] || '';
document.getElementById('foot').textContent = 'All-in prices (spot plus grid fees, levies and tax): published for today and tomorrow, then estimated by Offpeak Intelligence. Own solar and wind power is used first; what a job takes from it counts at the price it would have earned on the grid.';
OP.start();
renderJob();
update();
</script>
</body>
</html>
