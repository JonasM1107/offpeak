<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F5F2; --card: #FFFFFF; --line: #ECE9E4; --ink: #1C1B19; --muted: #77726A; --soft: #F6F5F2;
    --orange: #E8590C; --orange-soft: #FDEBDF; --orange-mid: #F8C9A8; --dark: #3A3733; --grey: #DDD8D0; --dear: #9C968D;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h3 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 20px 22px; }
  section { margin-top: 12px; }

  /* 3D stage */
  .stage { position: relative; height: 600px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  #view { position: absolute; inset: 0; }
  #view canvas { display: block; outline: none; }
  .topbar { position: absolute; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 3; }
  .topbar > * { pointer-events: auto; }
  .seg { display: inline-flex; background: rgba(246, 245, 242, .92); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 7px 14px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--muted); transition: all .2s; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(28, 27, 25, .08); }
  .seg .d { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--grey); margin-right: 7px; vertical-align: 1px; }
  .seg button.on .d { background: var(--orange); }
  .ghost { border: 1px solid var(--line); background: rgba(255, 255, 255, .92); backdrop-filter: blur(8px); border-radius: 10px; padding: 7px 12px; font-size: 12px; color: var(--muted); }
  .ghost:hover { color: var(--ink); }
  .panel { position: absolute; top: 68px; right: 16px; width: 256px; background: rgba(255, 255, 255, .95); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; padding: 16px; z-index: 3; box-shadow: 0 8px 30px rgba(28, 27, 25, .06); }
  .panel .now { display: flex; justify-content: space-between; align-items: baseline; }
  .clock { font-size: 26px; font-weight: 600; letter-spacing: -.02em; }
  .tag { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: #F1EFEB; color: var(--dark); white-space: nowrap; }
  .tag.cheap { background: var(--orange-soft); color: #B8430A; }
  .tag.dear { background: var(--dark); color: #fff; }
  .panel .price { color: var(--muted); font-size: 12px; margin: 2px 0 10px; }
  .rows .r { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 7px 0; font-size: 13px; border-top: 1px solid var(--line); }
  .rows .r span:first-child { color: var(--muted); }
  .rows .r b { font-weight: 600; text-align: right; }
  .brief { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
  .brief h4 { margin: 0 0 3px; font-size: 14px; font-weight: 600; }
  .brief p { margin: 0 0 8px; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .brief .go { border: 0; background: none; padding: 0; color: var(--orange); font-size: 12px; font-weight: 600; }
  .timeline { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 14px; background: rgba(255, 255, 255, .95); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 16px; padding: 10px 16px 10px 10px; z-index: 3; }
  #play { width: 38px; height: 38px; flex: none; border: 0; border-radius: 11px; background: var(--orange); color: #fff; display: grid; place-items: center; }
  #play svg { width: 14px; height: 14px; }
  .track { position: relative; flex: 1; height: 44px; }
  .bars { position: absolute; inset: 0 0 14px 0; display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; }
  .bars div { border-radius: 3px 3px 1px 1px; background: var(--grey); position: relative; }
  .bars div.cheap { background: var(--orange-mid); }
  .bars div.dear { background: var(--dear); }
  .bars div.on { background: var(--orange); }
  .bars div.sun::after { content: ''; position: absolute; left: 50%; top: -7px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: #F2A33A; }
  .ticks { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); }
  #hour { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; margin: 0; }
  .legend { display: flex; flex-direction: column; gap: 3px; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend i.dot { border-radius: 50%; width: 6px; height: 6px; background: #F2A33A; margin: 0 7px 0 1px; }
  .chip { display: flex; align-items: center; gap: 7px; background: rgba(255, 255, 255, .95); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px 4px 8px; font-size: 11.5px; white-space: nowrap; box-shadow: 0 2px 10px rgba(28, 27, 25, .07); cursor: pointer; pointer-events: auto; transition: transform .15s, border-color .15s; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--grey); }
  .chip.live i { background: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
  .chip b { font-weight: 600; }
  .chip span { color: var(--muted); }
  .chip.hover { transform: translateY(-2px); border-color: var(--orange-mid); }
  .chip.selected { background: var(--ink); border-color: var(--ink); color: #fff; transform: translateY(-2px); }
  .chip.selected span { color: #C9C4BC; }

  /* KPIs */
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; }
  .kpi p { margin: 0; font-size: 12.5px; color: var(--muted); }
  .kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; margin-top: 6px; }
  .kpi .v small, .tile .v small { font-size: 12.5px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .kpi.accent { background: var(--orange-soft); border-color: var(--orange-mid); }
  .kpi.accent .v { color: var(--orange); }

  /* Day plan */
  .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .keys { display: flex; gap: 16px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); }
  .keys i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .plan { display: grid; grid-template-columns: 170px 1fr 160px; column-gap: 14px; row-gap: 6px; align-items: center; }
  .plan .lbl { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .plan .lbl[data-id] { cursor: pointer; }
  .plan .lbl small { display: block; font-weight: 400; color: var(--muted); font-size: 11px; }
  .plan .lbl[data-id]:hover { color: var(--orange); }
  .plan .out { font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
  .plan .out b { color: var(--ink); font-weight: 600; }
  .strip { position: relative; display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; height: 30px; }
  .strip .c { border-radius: 5px; background: #F4F2EE; }
  .strip .c.cheap { background: var(--orange-soft); }
  .strip .c.dear { background: #E6E2DB; }
  .strip .c.now { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .strip.price .c { display: grid; place-items: center; font-size: 9.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .strip.price .c.cheap { color: #B8430A; font-weight: 600; }
  .strip.price .c.dear { background: var(--dear); color: #fff; }
  .strip .run { position: absolute; top: 6px; bottom: 6px; border-radius: 6px; background: var(--orange); }
  .strip .run.usual { top: auto; bottom: 2px; height: 5px; background: transparent; border: 1.5px solid var(--dear); border-radius: 3px; }
  .strip .run.discharge { background: var(--dark); }
  .strip .run.all { background: #CFC8BD; }
  .axis { display: grid; grid-template-columns: repeat(24, 1fr); gap: 2px; font-size: 9.5px; color: var(--muted); }
  .axis span { text-align: left; }

  /* Components: list + fact sheet */
  .comps { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; height: 760px; }
  .list { overflow-y: auto; padding: 6px !important; display: flex; flex-direction: column; gap: 4px; }
  .list .group { font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #A39E96; padding: 10px 12px 4px; }
  .item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid transparent; cursor: pointer; text-align: left; background: none; width: 100%; }
  .item:hover { background: var(--soft); }
  .item.on { background: var(--orange-soft); border-color: var(--orange-mid); }
  .ico { width: 38px; height: 38px; flex: none; border-radius: 11px; background: var(--soft); display: grid; place-items: center; }
  .ico svg { width: 20px; height: 20px; stroke: var(--dark); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .item.on .ico { background: #fff; }
  .item.on .ico svg { stroke: var(--orange); }
  .item .t { min-width: 0; flex: 1; }
  .item .t b { display: block; font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t span { font-size: 11.5px; color: var(--muted); }
  .item .w { font-size: 11px; font-weight: 600; color: #B8430A; background: var(--orange-soft); padding: 3px 7px; border-radius: 999px; white-space: nowrap; }
  .item.on .w { background: #fff; }
  .sheet { overflow-y: auto; padding: 22px 24px; }
  .sheet .top { display: flex; gap: 14px; align-items: flex-start; }
  .sheet .top .ico { width: 48px; height: 48px; border-radius: 14px; background: var(--orange-soft); }
  .sheet .top .ico svg { stroke: var(--orange); width: 24px; height: 24px; }
  .sheet h2 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
  .sheet .kind { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .sheet .nav { margin-left: auto; display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sheet .nav button { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: #fff; }
  .sheet .desc { margin: 14px 0 0; font-size: 13px; color: #4A4640; line-height: 1.5; }
  .facts { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 16px 0 18px; }
  .fact { background: var(--soft); border-radius: 12px; padding: 10px 12px; }
  .fact span { display: block; font-size: 11px; color: var(--muted); }
  .fact b { font-size: 14px; font-weight: 600; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tabs button { border: 0; background: none; padding: 9px 12px; font-size: 13px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--ink); border-bottom-color: var(--orange); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .tile p { margin: 0; font-size: 11px; color: var(--muted); }
  .tile .v { font-size: 18px; font-weight: 600; margin-top: 3px; letter-spacing: -.01em; }
  .tile.accent { background: var(--orange-soft); border-color: var(--orange-mid); }
  .tile.accent .v { color: var(--orange); }
  svg.chart { width: 100%; height: auto; display: block; }
  .insight { font-size: 13px; color: #4A4640; line-height: 1.5; margin: 10px 0 0; }
  .advice { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .adv { border-radius: 14px; padding: 14px; background: var(--soft); }
  .adv.best { background: var(--orange-soft); }
  .adv span { font-size: 11.5px; color: var(--muted); }
  .adv b { display: block; font-size: 20px; font-weight: 650; margin-top: 4px; letter-spacing: -.01em; }
  .adv.best b { color: var(--orange); }
  table.parts { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.parts td, table.parts th { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  table.parts th { font-size: 11px; color: var(--muted); font-weight: 500; }
  table.parts .n { text-align: right; font-variant-numeric: tabular-nums; }
  table.parts tbody tr { cursor: pointer; }
  table.parts tbody tr:hover, table.parts tbody tr.hl { background: var(--orange-soft); }
  .mat { display: grid; grid-template-columns: 150px 1fr 80px 100px; gap: 10px; align-items: center; font-size: 12.5px; padding: 5px 0; }
  .mat .bar { height: 8px; border-radius: 4px; background: #F1EEE9; overflow: hidden; }
  .mat .bar i { display: block; height: 100%; background: var(--orange); border-radius: 4px; }
  .mat .n { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  .note { font-size: 11.5px; color: var(--muted); margin-top: 12px; line-height: 1.5; }
  .foot { margin-top: 10px; font-size: 11.5px; color: var(--muted); }

  @media (max-width: 900px) {
    .stage { height: 520px; }
    .panel { top: auto; bottom: 88px; left: 16px; right: auto; width: auto; max-width: 260px; padding: 12px; }
    .panel .brief, .legend { display: none; }
    .kpis { grid-template-columns: 1fr 1fr; }
    .plan { grid-template-columns: 110px 1fr; }
    .plan .out { display: none; }
    .comps { grid-template-columns: 1fr; height: auto; }
    .list { flex-direction: row; overflow-x: auto; }
    .list .group { display: none; }
    .item { width: auto; flex: none; }
    .item .w { display: none; }
    .sheet { height: 680px; }
    .mat { grid-template-columns: 110px 1fr 70px; }
    .mat .co2 { display: none; }
  }
</style>

<body>
<div class="stage" id="stage">
  <div id="view"></div>
  <div class="topbar">
    <div class="seg" role="tablist" aria-label="Schedule">
      <button class="on" data-plan="offpeak" role="tab"><span class="d"></span>Offpeak plan</button>
      <button data-plan="usual" role="tab"><span class="d"></span>Usual day</button>
    </div>
    <button class="ghost" id="reset" type="button">Reset view</button>
  </div>
  <div class="panel">
    <div class="now"><span class="clock" id="clock">12:00</span><span class="tag" id="price-tag">normal</span></div>
    <div class="price" id="price">– ct/kWh</div>
    <div class="rows" id="rows"></div>
    <div class="brief" id="brief"></div>
  </div>
  <div class="timeline">
    <button id="play" type="button" aria-label="Play the day"></button>
    <div class="track">
      <div class="bars" id="bars"></div>
      <div class="ticks"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
      <input type="range" id="hour" min="0" max="23" step="1" value="12" aria-label="Hour of the day">
    </div>
    <div class="legend"><span><i style="background:var(--orange-mid)"></i>Cheap hours</span><span><i style="background:var(--dear)"></i>Expensive</span><span><i class="dot"></i>Own sun &amp; wind</span></div>
  </div>
</div>

<section class="kpis" id="kpis"></section>

<section class="card">
  <div class="head">
    <div><h3>Day plan</h3><div class="sub">When each machine should run or charge. Orange bar = Offpeak plan, outline = its usual time.</div></div>
    <div class="keys"><span><i style="background:var(--orange-soft)"></i>Cheap hour</span><span><i style="background:var(--dear)"></i>Expensive hour</span><span><i style="background:#F2A33A"></i>Own sun &amp; wind</span><span><i style="background:var(--orange)"></i>Runs / charges</span><span><i style="background:var(--dark)"></i>Battery gives power</span></div>
  </div>
  <div class="plan" id="plan"></div>
</section>

<section class="comps">
  <div class="card list" id="list"></div>
  <div class="card sheet" id="sheet"></div>
</section>
<div class="foot" id="foot"></div>

<script>window.OFFPEAK = __DATA__;</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// All numbers come from Python (offpeak/components.py and offpeak/demo_site.py).
// This file only draws them.
const D = window.OFFPEAK;
const COMPS = D.components;
const byId = Object.fromEntries(COMPS.map(c => [c.id, c]));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ── Renderer, camera, light ────────────────────────────────────────────────
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
view.appendChild(renderer.domElement);
const labels = new CSS2DRenderer();
Object.assign(labels.domElement.style, { position: 'absolute', inset: '0', pointerEvents: 'none' });
view.appendChild(labels.domElement);

const DAY_BG = new THREE.Color(0xFBFAF8), NIGHT_BG = new THREE.Color(0xF0F1F4);
const DAY_SUN = new THREE.Color(0xFFFAF4), MOON = new THREE.Color(0xDCE3F0);
const scene = new THREE.Scene();
scene.background = DAY_BG.clone();
scene.fog = new THREE.Fog(scene.background, 260, 520);
const camera = new THREE.PerspectiveCamera(28, 1, 1, 1000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.maxPolarAngle = 1.2; controls.minPolarAngle = 0.3; controls.enablePan = false;
controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 0.3;
const hemi = new THREE.HemisphereLight(0xFFFFFF, 0xF1EDE7, 1.6); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xFFFAF4, 2.2);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -75, right: 75, top: 75, bottom: -75, near: 1, far: 320 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
scene.add(sun, sun.target);

// ── Materials and small builders ───────────────────────────────────────────
const matte = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...o });
const M = {
  white: matte(0xFFFFFF), clay: matte(0xF4F1EC), roof: matte(0xE6E0D7), ink: matte(0x3A3733, { roughness: 0.6 }),
  steel: matte(0xC9C4BB, { roughness: 0.5, metalness: 0.2 }), frame: matte(0xCFC8BD), path: matte(0xE0DAD0),
  concrete: matte(0xE2DDD5), gravel: matte(0xEAE6DF), asphalt: matte(0xD9D5CE), glassDark: matte(0x2E2C29, { roughness: 0.3 }),
  orange: matte(0xE8590C, { emissive: 0xE8590C, emissiveIntensity: 0.15 }), line: matte(0xFFFFFF, { emissive: 0xFFFFFF, emissiveIntensity: 0.2 }),
};
const HIGHLIGHT = matte(0xE8590C, { emissive: 0xE8590C, emissiveIntensity: 0.45 });
function cellTexture() {
  const c = document.createElement('canvas'); c.width = 128; c.height = 192;
  const g = c.getContext('2d');
  g.fillStyle = '#2F3540'; g.fillRect(0, 0, 128, 192);
  g.strokeStyle = 'rgba(210,220,235,.55)'; g.lineWidth = 2;
  for (let x = 0; x <= 128; x += 128 / 6) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 192); g.stroke(); }
  for (let y = 0; y <= 192; y += 192 / 10) { g.beginPath(); g.moveTo(0, y); g.lineTo(128, y); g.stroke(); }
  g.strokeStyle = '#D9D4CC'; g.lineWidth = 6; g.strokeRect(0, 0, 128, 192);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const PANEL = new THREE.MeshStandardMaterial({ map: cellTexture(), roughness: 0.3, metalness: 0.25 });

// Every mesh is added to `current` and tagged with the part it belongs to, so a part
// picked in the fact sheet can light up in the model.
let current = null;
function tag(mesh, part) { mesh.userData.part = part; mesh.castShadow = true; mesh.receiveShadow = true; current.add(mesh); return mesh; }
function rbox(w, h, d, mat, x, y, z, part, r = 0.3) {
  const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, Math.min(r, w / 2.1, h / 2.1, d / 2.1)), mat);
  m.position.set(x, y, z); return tag(m, part);

function slotFor(kind) {
  const free = [...(SLOTS[kind] || []), ...SPARE].find(s => !taken.has(s.join(',')));

function flowPath(x, z) {
  const pts = [[Math.abs(x) > Math.abs(z) ? Math.sign(x) * 1.6 : 0, Math.abs(x) > Math.abs(z) ? 0 : Math.sign(z) * 1.6], [x * 0.5, z * 0.2], [x * 0.85, z * 0.8], [x, z]];

  const t = new THREE.Mesh(new THREE.TubeGeometry(curve, 80, 0.3, 8), M.path); t.receiveShadow = true; scene.add(t);

  return { curve, kw: 0, t: Math.random(), dots: Array.from({ length: n }, () => { const m = new THREE.Mesh(DOT, DOT_ORANGE); scene.add(m); return m; }) };
}
for (const c of COMPS) {
  if (!BUILD[c.kind]) continue;

  const onHall = slot[0] === 18 && slot[1] === -8;

function fit() {
  const w = view.clientWidth, h = view.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h); labels.setSize(w, h);
  camera.aspect = w / h;
  const shift = w > 900 ? 140 : 0;
  camera.setViewOffset(w, h, shift, -h * 0.03, w, h);
  camera.updateProjectionMatrix();
  const vfov = THREE.MathUtils.degToRad(camera.fov), hfov = 2 * Math.atan(Math.tan(vfov / 2) * (w - 2 * shift) / h);

}

function runs(values, test) {
  const out = []; let s = null;
  values.forEach((v, h) => { if (test(v) && s === null) s = h; if (!test(v) && s !== null) { out.push([s, h]); s = null; } });
  if (s !== null) out.push([s, 24]);

}
const bar = (a, b, cls = '') => `<div class="run ${cls}" style="left:calc(${a / 24 * 100}% + 1px);width:calc(${(b - a) / 24 * 100}% - 3px)"></div>`;

function deviceStrip(c, which = 'offpeak') {
  const s = ser(c.id, which);
  let inner = '';
  if (c.role === 'storage') { runs(s, v => v > LIVE).forEach(([a, b]) => { inner += bar(a, b); }); runs(s, v => v < -LIVE).forEach(([a, b]) => { inner += bar(a, b, 'discharge'); }); }
  else if (c.role === 'base') inner = bar(0, 24, 'all');
  else if (c.role === 'generation') runs(s, v => v > LIVE).forEach(([a, b]) => { inner += bar(a, b, 'all'); });
  else runs(s, v => v > 0).forEach(([a, b]) => { inner += bar(a, b); });
  return inner;
}
function dayPlan() {
  let html = `<div class="lbl">Price<small>ct/kWh, day-ahead</small></div><div class="strip price">${Array.from({ length: 24 }, (_, h) => `<div class="c ${D.price_class[h]} ${h === hour ? 'now' : ''}">${prices[h].toFixed(0)}</div>`).join('')}</div><div class="out">avg <b>${(sum(prices) / 24).toFixed(1)} ct</b></div>`;
  html += `<div class="lbl">Own sun &amp; wind<small>all generation on site</small></div><div class="strip">${Array.from({ length: 24 }, (_, h) => `<div class="c ${h === hour ? 'now' : ''}" style="background:rgba(242,163,58,${(0.08 + 0.85 * own[h] / ownMax).toFixed(2)})"></div>`).join('')}</div><div class="out">peak <b>${kw(ownMax)}</b></div>`;
  for (const c of COMPS.filter(c => c.role !== 'generation')) {

    const out = c.role === 'flexible' ? `<b>${c.advice.best}</b> · saves ${euro(saving)}` : c.role === 'storage' ? `charge <b>${c.advice.best || '–'}</b>` : '<b>all day</b>';

function chart(c) {
  // bars: this component's power per hour (plan orange, usual dashed); line: price
  const W = 640, H = 210, L = 34, R = 40, T = 14, B = 24, iw = W - L - R, bw = iw / 24;
  const s = ser(c.id), u = ser(c.id, 'usual');

  const signed = c.role === 'storage';

  let g = '';

    const cls = D.price_class[h];
    if (cls) g += `<rect x="${L + h * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="${cls === 'cheap' ? '#FDEBDF' : '#EEEBE6'}"/>`;
  }
  g += `<rect x="${L + hour * bw}" y="${T}" width="${bw}" height="${H - T - B}" fill="none" stroke="#1C1B19" stroke-dasharray="3 3"/>`;
  g += `<line x1="${L}" x2="${W - R}" y1="${y0}" y2="${y0}" stroke="#DDD8D0"/>`;
  for (let h = 0; h < 24; h++) {
    const v = s[h], x = L + h * bw + bw * 0.18, w = bw * 0.64, ht = Math.abs(v) * sc;
    if (Math.abs(v) > 0.01) g += `<rect x="${x}" y="${v >= 0 ? y0 - ht : y0}" width="${w}" height="${Math.max(ht, 1)}" rx="2" fill="${v >= 0 ? '#E8590C' : '#3A3733'}"/>`;
    if (plan === 'offpeak' && c.role === 'flexible' && u[h] > 0) g += `<rect x="${x}" y="${y0 - u[h] * sc}" width="${w}" height="${u[h] * sc}" rx="2" fill="none" stroke="#9C968D" stroke-width="1.2" stroke-dasharray="3 2"/>`;
  }
  const pmax = Math.max(...prices, 1) * 1.1, pmin = Math.min(0, ...prices), py = p => T + (H - T - B) * (1 - (p - pmin) / (pmax - pmin));
  g += `<polyline points="${prices.map((p, h) => `${L + h * bw + bw / 2},${py(p).toFixed(1)}`).join(' ')}" fill="none" stroke="#1C1B19" stroke-width="1.4" stroke-linejoin="round"/>`;
  if (signed) g += `<polyline points="${c.analytics[plan].soc_pct.map((p, h) => `${L + h * bw + bw / 2},${(T + (H - T - B) * (1 - p / 100)).toFixed(1)}`).join(' ')}" fill="none" stroke="#E8590C" stroke-width="1.6" stroke-dasharray="4 3"/>`;
  for (const h of [0, 6, 12, 18]) g += `<text x="${L + h * bw}" y="${H - 6}" font-size="11" fill="#77726A">${hh(h)}</text>`;
  g += `<text x="${L - 6}" y="${T + 8}" font-size="11" fill="#77726A" text-anchor="end">${Math.round(vmax / 1.15)}</text><text x="${L - 6}" y="${T + 20}" font-size="10" fill="#A39E96" text-anchor="end">kW</text>`;
  g += `<text x="${W - R + 6}" y="${T + 8}" font-size="11" fill="#1C1B19">${Math.round(pmax / 1.1)}</text><text x="${W - R + 6}" y="${T + 20}" font-size="10" fill="#A39E96">ct</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Power of ${esc(c.name)} per hour, with the price">${g}</svg>`;
}

function update() {

  document.getElementById('price').textContent = `${r.price_ct.toFixed(1)} ct/kWh${sunny[hour] ? ' · strong own sun & wind' : ''}`;
  document.getElementById('rows').innerHTML = [['Generating', kw(r.pv_kw + r.wind_kw)], ['Using', kw(r.load_kw)], [r.grid_kw >= 0 ? 'Buying' : 'Selling', kw(r.grid_kw)], ['Battery', `${Math.round(r.soc_pct)} %`]]
    .map(([a, b]) => `<div class="r"><span>${a}</span><b>${b}</b></div>`).join('');
  for (const c of COMPS) {
    const u = units[c.id]; if (!u) continue;
    const v = ser(c.id)[hour];
    u.value.textContent = c.role === 'storage' ? `${Math.round(c.analytics[plan].soc_pct[hour])} %` : c.role === 'flexible' && v === 0 ? 'idle' : kw(v);
    u.chip.classList.toggle('live', Math.abs(v) > LIVE);
    u.chip.classList.toggle('selected', c.id === selected);
  }
  const c = byId[selected];
  if (c) {
    const v = ser(c.id)[hour];
    const now = c.role === 'storage' ? (v > LIVE ? `charging ${kw(v)}` : v < -LIVE ? `giving ${kw(v)}` : 'idle') : Math.abs(v) > 0.01 ? kw(v) : 'off';
    document.getElementById('brief').innerHTML = `<h4>${esc(c.name)}</h4><p>${c.kind_label} · now ${now}${c.role === 'flexible' ? ` · best ${c.advice.best}` : ''}</p><button class="go" type="button" id="go">Open fact sheet ↓</button>`;
    document.getElementById('go').addEventListener('click', scrollToSheet);
  }
  [...bars.children].forEach((b, i) => { b.className = `${i === hour ? 'on' : D.price_class[i]} ${sunny[i] ? 'sun' : ''}`; });
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.plan === plan));

  for (const comp of COMPS) { const f = flows[comp.id]; if (f) { const v = ser(comp.id)[hour]; f.kw = comp.role === 'generation' ? -v : v; } }
  flows.__grid.kw = -r.grid_kw;
  flows.__grid.dots.forEach(d => { d.material = r.grid_kw > 0 ? DOT_INK : DOT_ORANGE; });
  animated.glow.forEach(({ m, id }) => { m.material.emissiveIntensity = ser(id)[hour] > 0 ? 0.9 : 0; });
  animated.plugs.forEach(({ m, id }) => { m.material.emissiveIntensity = ser(id)[hour] > 0 ? 1 : 0; });
  animated.soc.forEach(({ bar, id }) => { const s = byId[id].analytics[plan].soc_pct[hour] / 100; bar.scale.x = Math.max(0.03, s); bar.position.x = -3 * (1 - bar.scale.x); });

  const a = (hour + 0.5 - 6) / 12 * Math.PI, up = Math.sin(a), night = up < 0.05 || r.pv_kw < 0.5;
  if (night) sun.position.set(25, 130, 45); else sun.position.set(-Math.cos(a) * 80, Math.max(up, 0.55) * 110 + 20, 60);
  lightGoal.sun = night ? 1.0 : 1.6 + 0.8 * Math.max(0, up);
  lightGoal.hemi = night ? 1.45 : 1.6 + 0.2 * Math.max(0, up);
  lightGoal.night = night ? 1 : 0;

  const saving = sum(D.rows.usual, x => x.cost_eur) - sum(D.rows.offpeak, x => x.cost_eur);
  const gen = sum(R, x => x.pv_kw + x.wind_kw), used = sum(R, x => Math.min(x.pv_kw + x.wind_kw, x.load_kw + Math.max(x.battery_kw, 0)));
  document.getElementById('kpis').innerHTML = [
    ['Saved today vs usual', plan === 'offpeak' ? euro(saving) : '€0', true],
    ['Own power used', `${gen ? Math.round(used / gen * 100) : 0}<small>%</small>`],
    ['Bought from the grid', `${Math.round(sum(R, x => Math.max(x.grid_kw, 0)))}<small>kWh</small>`],
    ['Cost of power today', euro(sum(R, x => x.cost_eur))],
  ].map(([l, v, acc]) => `<div class="kpi ${acc ? 'accent' : ''}"><p>${l}</p><div class="v">${v}</div></div>`).join('');
  dayPlan();
  renderSheet();
}
function select(id, focus) {
  if (id !== selected) highlight(null);
  selected = id; if (focus) focusOn(id);
  renderList(); update();
}
function setHover(id) {
  for (const [k, u] of Object.entries(units)) u.chip.classList.toggle('hover', k === id);
  renderer.domElement.style.cursor = id ? 'pointer' : 'grab';
}

// ── Inputs ─────────────────────────────────────────────────────────────────
const hourInput = document.getElementById('hour');
hourInput.value = hour;
hourInput.addEventListener('input', () => { hour = +hourInput.value; stop(); update(); });
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => { plan = b.dataset.plan; update(); }));
const PLAY = '<svg viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
const PAUSE = '<svg viewBox="0 0 14 14"><rect x="2.5" y="1.5" width="3" height="11" rx="1" fill="currentColor"/><rect x="8.5" y="1.5" width="3" height="11" rx="1" fill="currentColor"/></svg>';
const playBtn = document.getElementById('play');
let timer = null;
function stop() { clearInterval(timer); timer = null; playBtn.innerHTML = PLAY; }
playBtn.innerHTML = PLAY;
playBtn.addEventListener('click', () => {
  if (timer) return stop();
  playBtn.innerHTML = PAUSE;
  timer = setInterval(() => { hour = (hour + 1) % 24; hourInput.value = hour; update(); }, 900);
});
const ray = new THREE.Raycaster(), pointer = new THREE.Vector2();
function pick(e) {
  const b = renderer.domElement.getBoundingClientRect();
  pointer.set((e.clientX - b.left) / b.width * 2 - 1, -((e.clientY - b.top) / b.height) * 2 + 1);
  ray.setFromCamera(pointer, camera);
  const hit = ray.intersectObjects(Object.values(units).map(u => u.g), true).find(h => h.object.userData.comp);
  return hit ? hit.object.userData : null;
}
let hovered = null;
renderer.domElement.addEventListener('pointermove', e => { const k = pick(e), id = k && k.comp; if (id !== hovered) { hovered = id; setHover(id); } });
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5) return;  // a drag
  const k = pick(e); if (!k) return;
  select(k.comp, true);
  if (k.part) { tab = 'parts'; highlight(k.part); renderSheet(); }
});

// name tags never cover each other: keep the selected one, then the rest in list order
function declutter() {
  const kept = [];
  for (const id of [selected, ...COMPS.map(c => c.id).filter(x => x !== selected)]) {
    const u = units[id]; if (!u) continue;
    u.chip.style.visibility = 'visible';
    const r = u.chip.getBoundingClientRect();
    if (kept.some(s => r.left < s.right + 4 && s.left < r.right + 4 && r.top < s.bottom + 3 && s.top < r.bottom + 3)) u.chip.style.visibility = 'hidden';
    else kept.push(r);
  }
}
// for automated checks
window.offpeakLayoutProblems = () => {
  const v = view.getBoundingClientRect(), out = [];
  const chips = Object.entries(units).filter(([, u]) => u.chip.style.visibility !== 'hidden').map(([id, u]) => [id, u.chip.getBoundingClientRect()]);
  chips.forEach(([n, r], i) => {
    if (r.left < v.left || r.right > v.right || r.top < v.top || r.bottom > v.bottom) out.push(`${n} leaves the scene`);
    chips.slice(i + 1).forEach(([m, s]) => { if (r.left < s.right && s.left < r.right && r.top < s.bottom && s.top < r.bottom) out.push(`${n} overlaps ${m}`); });
  });
  document.querySelectorAll('.kpi, .tile, .fact, .adv').forEach(el => { if (el.scrollWidth > el.clientWidth + 1) out.push(`overflow: ${el.textContent.trim().slice(0, 30)}`); });
  return out;
};

const src = [D.real.price ? 'Live day-ahead prices' : 'Demo prices (live prices unavailable)', D.real.weather ? 'live weather forecast' : 'demo weather'];
document.getElementById('foot').textContent = `${D.site.name} · ${D.site.city} · ${D.site.zone} · ${D.site.date}. ${src.join(', ')}. ${COMPS.length} components. The plan tries every allowed start time for each flexible load and keeps the cheapest.`;

new ResizeObserver(fit).observe(view);
fit();
renderList();
update();

// ── Animation loop ─────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let frame = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05), ease = 1 - Math.pow(0.002, dt);
  sun.intensity += (lightGoal.sun - sun.intensity) * ease;
  hemi.intensity += (lightGoal.hemi - hemi.intensity) * ease;
  scene.background.lerp(lightGoal.night ? NIGHT_BG : DAY_BG, ease);
  sun.color.lerp(lightGoal.night ? MOON : DAY_SUN, ease);
  scene.fog.color.copy(scene.background);
  windowsMat.emissiveIntensity += ((lightGoal.night ? 0.9 : 0) - windowsMat.emissiveIntensity) * ease;
  HIGHLIGHT.emissiveIntensity = 0.3 + 0.25 * Math.sin(performance.now() / 260);
  if (goal.target) {
    const offset = camera.position.clone().sub(controls.target);
    controls.target.lerp(goal.target, ease);
    const dist = offset.length() + ((goal.dist ?? offset.length()) - offset.length()) * ease;
    camera.position.copy(controls.target).add(offset.setLength(dist));
    if (controls.target.distanceTo(goal.target) < 0.05 && Math.abs(dist - (goal.dist ?? dist)) < 0.3) { goal.target = null; goal.dist = null; }
  }
  if (!reduceMotion) {
    animated.rotors.forEach(({ rotor, id }) => { rotor.rotation.z -= dt * (0.25 + ser(id)[hour] / 4); });
    animated.fans.forEach(({ g, axis, id }) => { if (Math.abs(ser(id)[hour]) > 0.01) g.rotation[axis] += dt * 5; });
    hubRing.scale.setScalar(1 + 0.04 * Math.sin(performance.now() / 400));
  }
  for (const f of Object.values(flows)) {
    const a = Math.abs(f.kw), on = a > LIVE;
    f.t += dt * (0.05 + a / 200) * Math.sign(f.kw || 1) * (reduceMotion ? 0 : 1);
    const size = 0.7 + Math.min(1, a / 40) * 0.7;
    f.dots.forEach((m, i) => {
      m.visible = on; if (!on) return;
      const u = (((i / f.dots.length + f.t) % 1) + 1) % 1;
      m.position.copy(f.curve.getPointAt(u)); m.position.y = 0.75; m.scale.setScalar(size);
    });
  }
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
  if (frame++ % 10 === 0) declutter();
});
</script>
</body>
