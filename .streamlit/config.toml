[theme]
base = "light"
primaryColor = "#FF5F00"
backgroundColor = "#F6F5F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1C1B19"
font = "sans-serif"

[client]
toolbarMode = "minimal"
# If a page ever fails, the visitor reads that something went wrong, never the code, its file
# paths or the values inside it. The full error is in the server log.
showErrorDetails = "none"

[server]
headless = true
# The largest file a visitor can send, in MB (Streamlit's default is 200). Three years of a
# Fronius history are 17 MB; a far larger file would only fill the server's memory.
maxUploadSize = 30
# Serve app/static/ at /app/static/: the screenshots on the landing page.
enableStaticServing = true
# Compress what the server sends to the browser. Off by default in Streamlit; our pages send
# whole views with their data (Power: two years of hourly prices, 612 KB, 83 KB compressed),
# so every page change gets much lighter on a real connection.
enableWebsocketCompression = true
